# ===================================================================
# MediStock Application Configuration
# ===================================================================
spring.application.name=medistock-backend
server.port=8080

# ===================================================================
# Swagger / OpenAPI Documentation Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

# ===================================================================
# Database Configuration (MySQL)
# Uncomment and update once MySQL is installed
# ===================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/medistock_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# Uncomment once MySQL is connected
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.security=DEBUG
