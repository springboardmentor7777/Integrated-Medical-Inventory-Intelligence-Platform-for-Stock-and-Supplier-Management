# ===================================================================
# MediStock Backend Configuration
# ===================================================================

# Server Port (uses dynamic PORT from Render, defaults to 8081 locally)
server.port=${PORT:8081}

# Application Name
spring.application.name=medistock-backend

# Database Configuration (Neon PostgreSQL)
# Set DB_URL (or DATABASE_URL), DB_USERNAME, and DB_PASSWORD for target PostgreSQL instance.
# Neon JDBC URLs should include sslmode=require.
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/medistock}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP settings suitable for hosted PostgreSQL services such as Neon
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Optional PostgreSQL tuning
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 console is only enabled by the test profile
spring.h2.console.enabled=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration (Secret key 256-bit min, Expiration in ms: 86400000 = 24 hours)
medistock.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
medistock.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (allows local dev and deployed Render frontend domains)
medistock.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,https://*.onrender.com}

# Logging
logging.level.com.medistock=INFO
logging.level.org.springframework.security=WARN
