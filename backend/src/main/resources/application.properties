# ===================================================================
# MediStock Backend Configuration
# ===================================================================

# Server Port (matches Frontend Vite Proxy on /api -> http://localhost:8080)
server.port=8080

# Application Name
spring.application.name=medistock-backend

# Database Configuration
# Default: Embedded persistent database with MySQL compatibility (persists in ./data/medistock)
# Override with DB_URL for external MySQL 8+ instance (e.g. jdbc:mysql://localhost:3306/medistock)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/medistock;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Web Console (accessible at http://localhost:8080/h2-console for inspecting tables in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration (Secret key 256-bit min, Expiration in ms: 86400000 = 24 hours)
medistock.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
medistock.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (allows Vite frontend at localhost:3000 and standard local ports)
medistock.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}

# Logging
logging.level.com.medistock=INFO
logging.level.org.springframework.security=WARN
