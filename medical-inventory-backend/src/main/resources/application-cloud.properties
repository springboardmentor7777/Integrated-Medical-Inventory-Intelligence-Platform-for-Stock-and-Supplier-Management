# TiDB Cloud profile. Do not place credentials or absolute local paths in this file.
spring.datasource.url=jdbc:mysql://${DB_HOST:gateway01.ap-southeast-1.prod.aws.tidbcloud.com}:${DB_PORT:4000}/${DB_NAME:medistock_db}?serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_SSL_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_SSL_TRUSTSTORE_PASSWORD}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
